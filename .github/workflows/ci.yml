name: Kubernetes Release Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image name
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=$IMAGE" >> "$GITHUB_ENV"

      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:$IMAGE_TAG" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Test Docker image health
        run: |
          set -e
          CONTAINER_ID=$(docker run -d -p 127.0.0.1:8080:80 "$IMAGE_NAME:$IMAGE_TAG")
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          docker logs "$CONTAINER_ID"
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker push "$IMAGE_NAME:latest"
          fi
