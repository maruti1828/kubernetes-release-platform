apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-health-dashboard
  namespace: release-platform
  labels:
    app: service-health-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-health-dashboard
  template:
    metadata:
      labels:
        app: service-health-dashboard
    spec:
      containers:
        - name: dashboard
          image: service-health-dashboard:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
